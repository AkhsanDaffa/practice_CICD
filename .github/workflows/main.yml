name: Build & Deploy to VPS

on:
  push:
    branches: [ "main" ]

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push API
        uses: docker/build-push-action@v4
        with:
          context: ./api
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/todo-api:latest

      - name: Build & Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:latest

  deploy-vps:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH & Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # 1. Masuk folder (kita akan clone ulang nanti di VPS)
            cd ~/project/todo-app
            
            # 2. Ambil config terbaru (docker-compose.prod.yml)
            git pull origin main
            
            # 3. Download Image Baru dari Docker Hub
            docker compose -f docker-compose.prod.yml pull
            
            # 4. Restart Container
            docker compose -f docker-compose.prod.yml up -d
            
            # 5. Bersihkan sampah image lama
            docker image prune -f