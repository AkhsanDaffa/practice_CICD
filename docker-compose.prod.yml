services:
  api:
    image: ${{ secrets.DOCKERHUB_USERNAME }}/todo-api:latest
    container_name: todo-backend
    restart: always
    ports:
      - "3100:3000"
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=supersecretpassword
      - DB_NAME=todo_db
      - PORT=3000
    depends_on:
      - db
    networks:

  client:
    image: ${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:latest
    container_name: todo-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - api
    networks:
      - app-network

  db:
    image: postgres:13
    container_name: todo-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: todo_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: